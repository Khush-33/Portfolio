<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#11151f"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a7c9e"/>
      <stop offset="100%" stop-color="#a8c5e6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Database diagram style -->
  <rect x="50" y="50" width="700" height="400" rx="8" fill="#080a10" stroke="#1a4d5c" stroke-width="1"/>
  <rect x="50" y="50" width="700" height="36" rx="8" fill="#11151f" stroke="#1a4d5c" stroke-width="1"/>
  <circle cx="75" cy="68" r="6" fill="#e67350" opacity="0.8"/>
  <circle cx="95" cy="68" r="6" fill="#f4d58d" opacity="0.8"/>
  <circle cx="115" cy="68" r="6" fill="#4ade80" opacity="0.8"/>
  <text x="150" y="73" font-family="monospace" font-size="11" fill="#c5d1d9">ipl-auction-sim  schema.sql  ▓</text>

  <!-- ER Diagram -->
  <g font-family="monospace" font-size="10">
    <!-- Player table -->
    <rect x="70" y="120" width="200" height="180" fill="#0a0d14" rx="4" stroke="#4a7c9e" stroke-width="2"/>
    <rect x="70" y="120" width="200" height="30" fill="#4a7c9e" rx="4"/>
    <text x="170" y="140" text-anchor="middle" fill="#0a0d14" font-weight="bold">Player</text>
    <text x="90" y="165" fill="#4a7c9e">PK  player_id  INT</text>
    <text x="90" y="185" fill="#c5d1d9">name  VARCHAR(50)</text>
    <text x="90" y="205" fill="#c5d1d9">base_price  DECIMAL</text>
    <text x="90" y="225" fill="#c5d1d9">role  ENUM</text>
    <text x="90" y="245" fill="#c5d1d9">status  ENUM</text>
    <text x="90" y="265" fill="#c5d1d9">FK  team_id  INT</text>

    <!-- Team table -->
    <rect x="300" y="120" width="200" height="180" fill="#0a0d14" rx="4" stroke="#4a7c9e" stroke-width="2"/>
    <rect x="300" y="120" width="200" height="30" fill="#4a7c9e" rx="4"/>
    <text x="400" y="140" text-anchor="middle" fill="#0a0d14" font-weight="bold">Team</text>
    <text x="320" y="165" fill="#4a7c9e">PK  team_id  INT</text>
    <text x="320" y="185" fill="#c5d1d9">name  VARCHAR(50)</text>
    <text x="320" y="205" fill="#c5d1d9">purse  DECIMAL</text>
    <text x="320" y="225" fill="#c5d1d9">max_players  INT</text>
    <text x="320" y="245" fill="#c5d1d9">owner  VARCHAR(50)</text>

    <!-- Auctioneer table -->
    <rect x="530" y="120" width="200" height="180" fill="#0a0d14" rx="4" stroke="#4a7c9e" stroke-width="2"/>
    <rect x="530" y="120" width="200" height="30" fill="#4a7c9e" rx="4"/>
    <text x="630" y="140" text-anchor="middle" fill="#0a0d14" font-weight="bold">Auctioneer</text>
    <text x="550" y="165" fill="#4a7c9e">PK  auc_id  INT</text>
    <text x="550" y="185" fill="#c5d1d9">name  VARCHAR(50)</text>
    <text x="550" y="205" fill="#c5d1d9">current_bid  DECIMAL</text>
    <text x="550" y="225" fill="#c5d1d9">status  ENUM</text>

    <!-- Bid table -->
    <rect x="185" y="320" width="200" height="120" fill="#0a0d14" rx="4" stroke="#f4d58d" stroke-width="2"/>
    <rect x="185" y="320" width="200" height="30" fill="#f4d58d" rx="4"/>
    <text x="285" y="340" text-anchor="middle" fill="#0a0d14" font-weight="bold">Bid</text>
    <text x="205" y="365" fill="#f4d58d">PK  bid_id  INT</text>
    <text x="205" y="385" fill="#c5d1d9">FK  player_id  INT</text>
    <text x="205" y="405" fill="#c5d1d9">FK  team_id  INT</text>
    <text x="205" y="425" fill="#c5d1d9">amount  DECIMAL</text>

    <!-- Relationship lines -->
    <path d="M270,210 L300,210" fill="none" stroke="#1a4d5c" stroke-width="1.5" stroke-dasharray="4,4"/>
    <path d="M400,210 M530,210" fill="none" stroke="#1a4d5c" stroke-width="1.5" stroke-dasharray="4,4"/>
    <path d="M285,320 L285,300" fill="none" stroke="#1a4d5c" stroke-width="1.5" stroke-dasharray="4,4"/>
    <path d="M285,300 L400,300 L400,210" fill="none" stroke="#1a4d5c" stroke-width="1.5" stroke-dasharray="4,4"/>

    <!-- Cardinality -->
    <text x="285" y="205" font-size="8" fill="#f4d58d">1:N</text>
    <text x="465" y="205" font-size="8" fill="#f4d58d">1:N</text>
    <text x="285" y="300" font-size="8" fill="#f4d58d">N:1</text>
  </g>

  <!-- Simulation output -->
  <rect x="50" y="50" width="200" height="120" rx="8" fill="transparent" stroke="#1a4d5c" stroke-width="1" transform="translate(0, 0)"/>

  <!-- Right side - console output -->
  <rect x="550" y="320" width="180" height="120" fill="#0a0d14" rx="4" stroke="#4a7c9e" stroke-width="1"/>
  <text x="570" y="345" font-family="monospace" font-size="10" fill="#4a7c9e">SIMULATION LOG</text>
  <g font-family="monospace" font-size="8" fill="#c5d1d9" opacity="0.8">
    <text x="570" y="370">▶ Auction started</text>
    <text x="570" y="385" fill="#f4d58d">⟳ Bidding: Virat Kohli</text>
    <text x="570" y="400" fill="#4ade80">✓ CSK: ₹14.5 Cr</text>
    <text x="570" y="415" fill="#e67350">✗ MI: Pass</text>
    <text x="570" y="430" fill="#a8c5e6">● Sold to CSK</text>
  </g>

  <!-- Type badge -->
  <rect x="580" y="430" width="80" height="22" rx="11" fill="#4a7c9e" opacity="0.2" stroke="#4a7c9e" stroke-width="1"/>
  <text x="620" y="445" text-anchor="middle" font-family="monospace" font-size="9" fill="#4a7c9e" font-weight="bold">Type-M</text>

  <!-- Tech badges -->
  <g font-family="monospace" font-size="8" fill="#1a4d5c">
    <rect x="70" y="430" width="50" height="18" rx="3" fill="#11151f" stroke="#4a7c9e"/>
    <text x="95" y="443" text-anchor="middle" fill="#4a7c9e">MySQL</text>

    <rect x="130" y="430" width="50" height="18" rx="3" fill="#11151f" stroke="#f4d58d"/>
    <text x="155" y="443" text-anchor="middle" fill="#f4d58d">OOP</text>

    <rect x="190" y="430" width="60" height="18" rx="3" fill="#11151f" stroke="#a8c5e6"/>
    <text x="220" y="443" text-anchor="middle" fill="#a8c5e6">DBMS</text>
  </g>
</svg>
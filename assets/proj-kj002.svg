<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#11151f"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a8c5e6"/>
      <stop offset="100%" stop-color="#4a7c9e"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Terminal/IDE style -->
  <rect x="50" y="50" width="700" height="400" rx="8" fill="#080a10" stroke="#1a4d5c" stroke-width="1"/>
  <rect x="50" y="50" width="700" height="36" rx="8" fill="#11151f" stroke="#1a4d5c" stroke-width="1"/>
  <circle cx="75" cy="68" r="6" fill="#e67350" opacity="0.8"/>
  <circle cx="95" cy="68" r="6" fill="#f4d58d" opacity="0.8"/>
  <circle cx="115" cy="68" r="6" fill="#4ade80" opacity="0.8"/>
  <text x="150" y="73" font-family="monospace" font-size="11" fill="#c5d1d9">eco-cloud-scheduler  main.cpp  ▓</text>

  <!-- Code editor -->
  <rect x="70" y="110" width="660" height="320" fill="#0a0d14" rx="4"/>
  <g font-family="monospace" font-size="11" fill="#c5d1d9" line-height="1.6">
    <text x="90" y="140" fill="#a8c5e6">// Eco-Cloud Carbon-Aware Scheduler</text>
    <text x="90" y="165" fill="#c5d1d9">class CarbonAwareScheduler {</text>
    <text x="110" y="190" fill="#4ade80">FibonacciHeap</text><text x="220" y="190" fill="#c5d1d9"> readyQueue;</text>
    <text x="110" y="215" fill="#4ade80">SplayTree</text><text x="210" y="215" fill="#c5d1d9"> jobCache;</text>
    <text x="110" y="240" fill="#4ade80">BTree</text><text x="185" y="240" fill="#c5d1d9"> logIndex;</text>

    <text x="90" y="275" fill="#a8c5e6">// 7-State Process Model</text>
    <text x="110" y="300" fill="#c5d1d9">enum ProcessState {</text>
    <text x="130" y="325" fill="#f4d58d">NEW, READY, RUNNING,</text>
    <text x="130" y="350" fill="#f4d58d">WAITING, BLOCKED,</text>
    <text x="130" y="375" fill="#f4d58d">TERMINATED, PREEMPTED</text>
    <text x="110" y="400" fill="#c5d1d9">};</text>

    <text x="90" y="425" fill="#a8c5e6">// Banker's Algorithm Deadlock Avoidance</text>
    <text x="110" y="450" fill="#c5d1d9">bool isSafeState(vector<int> available,</text>
    <text x="130" y="475" fill="#c5d1d9">                 vector<vector<int>> max,</text>
    <text x="130" y="500" fill="#c5d1d9">                 vector<vector<int>> allocation);</text>
  </g>

  <!-- Sidebar - metrics -->
  <rect x="50" y="50" width="200" height="120" rx="8" fill="transparent" stroke="#1a4d5c" stroke-width="1" transform="translate(0, 0)"/>
  <!-- Actually sidebar on right -->
  <rect x="550" y="110" width="180" height="320" fill="#0a0d14" rx="4" stroke="#1a4d5c" stroke-width="1"/>
  <text x="570" y="140" font-family="monospace" font-size="10" fill="#a8c5e6">METRICS</text>
  <line x1="560" y1="148" x2="720" y2="148" stroke="#1a4d5c"/>

  <g font-family="monospace" font-size="9" fill="#c5d1d9">
    <text x="570" y="175">Carbon Reduction: <tspan fill="#4ade80">34.2%</tspan></text>
    <text x="570" y="200">Throughput: <tspan fill="#f4d58d">1,247 jobs/hr</tspan></text>
    <text x="570" y="225">Avg Latency: <tspan fill="#a8c5e6">12.3ms</tspan></text>
    <text x="570" y="250">Deadlocks: <tspan fill="#4ade80">0</tspan></text>
    <text x="570" y="275">RL Accuracy: <tspan fill="#e67350">91.7%</tspan></text>
    <text x="570" y="300">ARIMA MAPE: <tspan fill="#c084fc">4.2%</tspan></text>
  </g>

  <!-- Type badge -->
  <rect x="580" y="430" width="80" height="22" rx="11" fill="#a8c5e6" opacity="0.2" stroke="#a8c5e6" stroke-width="1"/>
  <text x="620" y="445" text-anchor="middle" font-family="monospace" font-size="9" fill="#a8c5e6" font-weight="bold">Type-O</text>

  <!-- Tech badges -->
  <g font-family="monospace" font-size="8" fill="#1a4d5c">
    <rect x="70" y="430" width="45" height="18" rx="3" fill="#11151f" stroke="#a8c5e6"/>
    <text x="92" y="443" text-anchor="middle" fill="#a8c5e6">C++</text>

    <rect x="140" y="430" width="55" height="18" rx="3" fill="#11151f" stroke="#4ade80"/>
    <text x="167" y="443" text-anchor="middle" fill="#4ade80">Python</text>

    <rect x="200" y="430" width="70" height="18" rx="3" fill="#11151f" stroke="#e67350"/>
    <text x="235" y="443" text-anchor="middle" fill="#e67350">RL Agent</text>

    <rect x="280" y="430" width="65" height="18" rx="3" fill="#11151f" stroke="#c084fc"/>
    <text x="312" y="443" text-anchor="middle" fill="#c084fc">OS Internals</text>
  </g>
</svg>
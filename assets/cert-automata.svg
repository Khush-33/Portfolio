<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="certBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#11151f"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f4d58d"/>
      <stop offset="50%" stop-color="#c5d1d9"/>
      <stop offset="100%" stop-color="#f4d58d"/>
    </linearGradient>
    <linearGradient id="sealGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4d58d"/>
      <stop offset="100%" stop-color="#b8965c"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#certBg)"/>

  <!-- Border frame -->
  <rect x="20" y="20" width="760" height="560" fill="none" stroke="url(#goldBorder)" stroke-width="3"/>
  <rect x="30" y="30" width="740" height="540" fill="none" stroke="#1a4d5c" stroke-width="1"/>

  <!-- Corner ornaments -->
  <g stroke="url(#goldBorder)" stroke-width="2" fill="none">
    <path d="M50,50 L80,50 M50,50 L50,80"/>
    <path d="M750,50 L720,50 M750,50 L750,80"/>
    <path d="M50,550 L80,550 M50,550 L50,520"/>
    <path d="M750,550 L720,550 M750,550 L750,520"/>
  </g>

  <!-- Header -->
  <text x="400" y="100" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#f4d58d" font-weight="bold">CERTIFICATE OF COMPLETION</text>

  <!-- Decorative line -->
  <line x1="200" y1="115" x2="600" y2="115" stroke="url(#goldBorder)" stroke-width="1.5"/>

  <!-- Presented to -->
  <text x="400" y="155" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#c5d1d9" opacity="0.8">This is to certify that</text>

  <!-- Name -->
  <text x="400" y="200" text-anchor="middle" font-family="Georgia, serif" font-size="32" fill="#ffffff" font-weight="bold">Khush Jain</text>

  <!-- Has successfully completed -->
  <text x="400" y="245" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#c5d1d9" opacity="0.8">has successfully completed the course</text>

  <!-- Course title -->
  <text x="400" y="290" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#a8c5e6" font-weight="bold" font-style="italic">Automata and Computability</text>

  <!-- Institution -->
  <text x="400" y="340" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#f4d58d">BITS Pilani</text>

  <!-- Date -->
  <text x="400" y="380" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#c5d1d9" opacity="0.7">June 2026</text>

  <!-- Seal -->
  <g transform="translate(400, 460)">
    <circle r="50" fill="none" stroke="url(#sealGold)" stroke-width="2"/>
    <circle r="42" fill="none" stroke="url(#sealGold)" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="0" y="5" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#f4d58d" font-weight="bold">BITS PILANI</text>
    <text x="0" y="22" text-anchor="middle" font-family="Georgia, serif" font-size="8" fill="#c5d1d9">EST. 1964</text>
  </g>

  <!-- Verification ID -->
  <text x="400" y="535" text-anchor="middle" font-family="monospace" font-size="11" fill="#1a4d5c">Verification ID: D1815JFLY3EV</text>

  <!-- Coursera logo placeholder -->
  <g transform="translate(60, 530)">
    <rect width="80" height="20" rx="3" fill="#1a4d5c"/>
    <text x="40" y="14" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#a8c5e6" font-weight="bold">COURSERA</text>
  </g>

  <!-- Signature line -->
  <line x1="480" y1="480" x2="720" y2="480" stroke="#c5d1d9" stroke-width="1" opacity="0.5"/>
  <text x="600" y="498" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#c5d1d9" opacity="0.6">Authorized Signature</text>
</svg>
    <rect x="90" y="200" width="320" height="35" fill="#11151f" rx="3" stroke="#a8c5e6" stroke-width="1"/>
    <text x="105" y="223" fill="#a8c5e6">📄 Technical_Specifications_v2.pdf</text>
    <text x="370" y="223" fill="#4ade80">Processed</text>

    <rect x="90" y="245" width="320" height="35" fill="#11151f" rx="3" stroke="#f4d58d" stroke-width="1"/>
    <text x="105" y="268" fill="#f4d58d">📄 Requirements_Document.pdf</text>
    <text x="370" y="268" fill="#f4d58d">Processing...</text>

    <rect x="90" y="290" width="320" height="35" fill="#11151f" rx="3" stroke="#c5d1d9" stroke-width="1" opacity="0.5"/>

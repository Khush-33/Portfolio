    <text x="370" y="313" fill="#c5d1d9" opacity="0.7">Pending</text>

    <rect x="90" y="335" width="320" height="35" fill="#11151f" rx="3" stroke="#c5d1d9" stroke-width="1" opacity="0.5"/>
    <text x="105" y="358" fill="#c5d1d9" opacity="0.7">📄 Test_Cases_Report.pdf</text>
    <text x="370" y="358" fill="#c5d1d9" opacity="0.7">Pending</text>

    <rect x="90" y="380" width="320" height="35" fill="#11151f" rx="3" stroke="#c5d1d9" stroke-width="1" opacity="0.5"/>
    <text x="105" y="403" fill="#c5d1d9" opacity="0.7">📄 Meeting_Notes_Week_1.pdf</text>
    <text x="370" y="403" fill="#c5d1d9" opacity="0.7">Pending</text>
  </g>

  <!-- Right: Search & Classification -->

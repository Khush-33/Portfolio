    <text x="680" y="370" fill="#4ade80">79%</text>
  </g>

  <text x="490" y="400" font-family="monospace" font-size="9" fill="#c5d1d9" opacity="0.6">Embeddings: all-MiniLM-L6-v2</text>
  <text x="490" y="415" font-family="monospace" font-size="9" fill="#c5d1d9" opacity="0.6">Review time reduced: 80%+</text>

  <!-- Type badge -->
  <rect x="580" y="430" width="80" height="22" rx="11" fill="#e67350" opacity="0.2" stroke="#e67350" stroke-width="1"/>
  <text x="620" y="445" text-anchor="middle" font-family="monospace" font-size="9" fill="#e67350" font-weight="bold">Type-K</text>

  <!-- Tech badges -->
  <g font-family="monospace" font-size="8" fill="#1a4d5c">
    <rect x="70" y="430" width="55" height="18" rx="3" fill="#11151f" stroke="#e67350"/>

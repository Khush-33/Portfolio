    <rect x="480" y="310" width="230" height="30" fill="#11151f" rx="3"/>
    <text x="495" y="330" fill="#a8c5e6">Architecture</text>
    <text x="680" y="330" fill="#4ade80">82%</text>

    <rect x="480" y="350" width="230" height="30" fill="#11151f" rx="3"/>

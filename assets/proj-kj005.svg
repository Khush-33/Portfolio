    <rect x="135" y="430" width="70" height="18" rx="3" fill="#11151f" stroke="#a8c5e6"/>
    <text x="170" y="443" text-anchor="middle" fill="#a8c5e6">Embeddings</text>

    <rect x="215" y="430" width="85" height="18" rx="3" fill="#11151f" stroke="#f4d58d"/>
    <text x="257" y="443" text-anchor="middle" fill="#f4d58d">Semantic Search</text>
  </g>

  <text x="490" y="215" font-family="Satoshi, sans-serif" font-size="12" fill="#a8c5e6" font-weight="bold">Classification Results</text>

  <g font-family="monospace" font-size="9" fill="#c5d1d9">
    <rect x="480" y="230" width="230" height="30" fill="#11151f" rx="3"/>
